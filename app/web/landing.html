<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Native Researcher</title>
  <meta name="description" content="Project launcher for Native Researcher workspaces.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="landing-body">
  <main class="landing-minimal-shell">
    <section class="landing-minimal-panel" aria-label="Recent projects">
      <div class="landing-minimal-kicker">Native Researcher</div>
      <div class="landing-minimal-head">
        <h1 class="landing-minimal-title">Recent projects</h1>
        <form id="createProjectForm" class="landing-minimal-create-form">
          <input
            id="createProjectNameInput"
            class="landing-minimal-create-input"
            type="text"
            maxlength="200"
            placeholder="Project name"
            autocomplete="off"
          >
          <button id="createProjectButton" class="landing-minimal-create" type="submit">New project</button>
        </form>
      </div>
      <div id="projectList" class="landing-minimal-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="/static/landing.js"></script>
</body>

</html>
